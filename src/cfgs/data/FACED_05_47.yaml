# FACED 数据：0.05–47 Hz 带通，每被试 pkl 经 scripts/convert_pkl_to_mat.py 转成 .mat 后使用
# data_dir 指向「转成 .mat 后的根目录」，代码会读 data_dir/processed_data 下的 .mat
# after_remarks_dir：FACED 视频播放顺序，每被试 subXXX/After_remarks.mat
dataset_name: 'FACED'
data_dir: '${oc.env:DAEST_DATA_ROOT}/data-faced/0.05–47 Hz_mat'
after_remarks_dir: '${oc.env:DAEST_RUNS_ROOT}/After_remarks'
fs: 250
n_channs: 32
n_session: 1
n_subs: 123
n_vids: 28

n_class: 9
timeLen: 5
timeStep: 2
timeLen2: 1
timeStep2: 1

class_names: ['Anger', 'Disgust', 'Fear', 'Sadness', 'neutral', 'Amusement', 'Inspiration', 'Joy', 'Tenderness']
