# 实测环境（结果产出时）。CUDA 版本按本机驱动调整。
name: daest
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.11.13
  - pytorch=2.2.2
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pandas=2.3.2
  - scipy=1.16.2
  - matplotlib=3.10.6
  - tqdm
  - pip
  - pip:
      - pytorch-lightning==2.5.5
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - mne==1.12.1
      - hdf5storage
